name = "Razor"
path_suffixes = ["razor", "cshtml"]
line_comments = ["@* "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false },
    { start = "@*", end = "*@", close = true, newline = false },
]
