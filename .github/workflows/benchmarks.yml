name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: '17 10 * * 2'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full benchmark suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  end-to-end:
    name: End-to-end performance (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            workspace_budget_ms: 120000
            ready_budget_ms: 130000
          - os: windows-latest
            rid: win-x64
            workspace_budget_ms: 165000
            ready_budget_ms: 175000
          - os: macos-26
            rid: osx-arm64
            workspace_budget_ms: 120000
            ready_budget_ms: 130000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Install Native AOT prerequisites
        run: >-
          dotnet run --file scripts/Install-NativeAotPrerequisites.cs --
          --runtime ${{ matrix.rid }}

      - name: Run end-to-end performance smoke
        if: >-
          github.event_name != 'schedule' &&
          github.event_name != 'release' &&
          (github.event_name != 'workflow_dispatch' || !inputs.full)
        run: >-
          dotnet run --file scripts/Run-EndToEndPerformance.cs --
          --iterations 1
          --workspace-budget-ms ${{ matrix.workspace_budget_ms }}
          --ready-budget-ms ${{ matrix.ready_budget_ms }}

      - name: Run complete end-to-end performance measurement
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.full)
        run: >-
          dotnet run --file scripts/Run-EndToEndPerformance.cs --
          --iterations 3
          --workspace-budget-ms ${{ matrix.workspace_budget_ms }}
          --ready-budget-ms ${{ matrix.ready_budget_ms }}

      - name: Upload end-to-end performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: end-to-end-performance-results-${{ matrix.rid }}
          path: artifacts/end-to-end-performance
          if-no-files-found: error

  smoke:
    name: Benchmark smoke
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'release' &&
      (github.event_name != 'workflow_dispatch' || !inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Run smoke benchmarks
        run: dotnet run --file scripts/Run-Benchmarks.cs -- --job Dry

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-results
          path: artifacts/benchmarks
          if-no-files-found: error

  full:
    name: Full benchmarks
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Run full benchmarks
        run: dotnet run --file scripts/Run-Benchmarks.cs

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: artifacts/benchmarks
          if-no-files-found: error
