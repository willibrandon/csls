name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Canonical NuGet version to verify without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      timestamp: ${{ steps.release.outputs.timestamp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore solution
        run: dotnet restore Csls.slnx

      - name: Restore file-app dependencies
        run: dotnet restore scripts/Assemble-ReleaseAssets.cs

      - name: Verify package health
        run: dotnet run --file scripts/Verify-PackageHealth.cs

      - name: Upload package health reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-health
          path: artifacts/package-health
          if-no-files-found: error
          retention-days: 14

      - name: Validate release identity
        id: release
        run: >-
          dotnet run --file scripts/Prepare-Release.cs --
          --version "${{ inputs.version || github.ref_name }}"
          --ref "${{ github.ref }}"
          --event "${{ github.event_name }}"
          --dry-run "${{ github.event_name == 'workflow_dispatch' }}"

  native-assets:
    name: Build release assets (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            validation: execute
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            validation: execute
          - os: ubuntu-latest
            rid: linux-musl-x64
            validation: package
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            validation: package
          - os: windows-latest
            rid: win-x64
            validation: execute
          - os: windows-11-arm
            rid: win-arm64
            validation: execute
          - os: windows-latest
            rid: win-x86
            validation: execute
          - os: macos-26-intel
            rid: osx-x64
            validation: execute
          - os: macos-26
            rid: osx-arm64
            validation: execute

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install Native AOT prerequisites
        run: dotnet run --file scripts/Install-NativeAotPrerequisites.cs -- --runtime ${{ matrix.rid }}

      - name: Provision target .NET SDK
        if: matrix.rid == 'win-x86'
        run: dotnet run --file scripts/InstallDotNet.cs -- --runtime ${{ matrix.rid }}

      - name: Build and verify release assets
        if: matrix.rid != 'win-x86'
        run: >-
          dotnet run --file scripts/Build-ReleaseAssets.cs --
          --version "${{ needs.prepare.outputs.version }}"
          --runtime "${{ matrix.rid }}"
          --output "artifacts/release-input/${{ matrix.rid }}"
          --validation "${{ matrix.validation }}"

      - name: Build and verify Windows x86 release assets
        if: matrix.rid == 'win-x86'
        run: >-
          dotnet run --file scripts/Build-ReleaseAssets.cs --
          --version "${{ needs.prepare.outputs.version }}"
          --runtime "${{ matrix.rid }}"
          --output "artifacts/release-input/${{ matrix.rid }}"
          --validation "${{ matrix.validation }}"
          --target-dotnet-root "artifacts/tools/dotnet/${{ matrix.rid }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release-input/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release
    needs:
      - prepare
      - native-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Download native assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts/release-input
          merge-multiple: true

      - name: Provision Microsoft SBOM Tool
        id: sbom
        run: dotnet run --file scripts/Provision-SbomTool.cs

      - name: Assemble verified release
        run: >-
          dotnet run --file scripts/Assemble-ReleaseAssets.cs --
          --version "${{ needs.prepare.outputs.version }}"
          --timestamp "${{ needs.prepare.outputs.timestamp }}"
          --input artifacts/release-input
          --output artifacts/release-final
          --sbom-tool "${{ steps.sbom.outputs.path }}"

      - name: Attest release assets
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/release-final/public/*

      - name: Attest release SBOM
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-path: artifacts/release-final/public
          sbom-path: artifacts/release-final/public/csls-${{ needs.prepare.outputs.version }}.spdx.json

      - name: Upload complete release
        uses: actions/upload-artifact@v7
        with:
          name: release-final
          path: artifacts/release-final
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Publish containers
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - assemble
      - validate-containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      csls-digest: ${{ steps.csls.outputs.digest }}
      csls-mcp-digest: ${{ steps.csls_mcp.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download complete release
        uses: actions/download-artifact@v8
        with:
          name: release-final
          path: artifacts/release-final

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish csls container
        id: csls
        uses: docker/build-push-action@v7
        with:
          context: artifacts/release-final/container
          file: deploy/Containerfile
          target: csls
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/willibrandon/csls:${{ needs.prepare.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Publish csls-mcp container
        id: csls_mcp
        uses: docker/build-push-action@v7
        with:
          context: artifacts/release-final/container
          file: deploy/Containerfile
          target: csls-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/willibrandon/csls-mcp:${{ needs.prepare.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Scan published csls digest with Picket
        uses: willibrandon/picket@v0
        env:
          PICKET_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PICKET_REGISTRY_USERNAME: ${{ github.actor }}
        with:
          registry-image: ghcr.io/willibrandon/csls@${{ steps.csls.outputs.digest }}
          registry-max-image-megabytes: 2048
          registry-password-env: PICKET_REGISTRY_PASSWORD
          registry-username-env: PICKET_REGISTRY_USERNAME
          cache-mode: secret-hash-only
          fail-on: findings
          ignore-path: .picketignore
          max-archive-depth: 2
          max-archive-entries: 100000
          max-archive-megabytes: 4096
          max-archive-ratio: 1000
          max-target-megabytes: 64
          redact: 100
          report-directory: artifacts/picket-registry-csls
          timeout: 900
          upload-sarif: false

      - name: Scan published csls-mcp digest with Picket
        uses: willibrandon/picket@v0
        env:
          PICKET_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PICKET_REGISTRY_USERNAME: ${{ github.actor }}
        with:
          registry-image: ghcr.io/willibrandon/csls-mcp@${{ steps.csls_mcp.outputs.digest }}
          registry-max-image-megabytes: 2048
          registry-password-env: PICKET_REGISTRY_PASSWORD
          registry-username-env: PICKET_REGISTRY_USERNAME
          cache-mode: secret-hash-only
          fail-on: findings
          ignore-path: .picketignore
          max-archive-depth: 2
          max-archive-entries: 100000
          max-archive-megabytes: 4096
          max-archive-ratio: 1000
          max-target-megabytes: 64
          redact: 100
          report-directory: artifacts/picket-registry-csls-mcp
          timeout: 900
          upload-sarif: false

      - name: Upload published image scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: picket-release-registry
          path: artifacts/picket-registry-*
          if-no-files-found: error
          retention-days: 14

  validate-containers:
    name: Validate containers (${{ matrix.architecture }})
    needs:
      - prepare
      - assemble
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: amd64
          - os: ubuntu-24.04-arm
            architecture: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Download complete release
        uses: actions/download-artifact@v8
        with:
          name: release-final
          path: artifacts/release-final

      - name: Verify release containers
        run: >-
          dotnet run --file scripts/Verify-ReleaseContainers.cs --
          --version "${{ needs.prepare.outputs.version }}"
          --revision "${{ github.sha }}"
          --output artifacts/release-container-validation

      - name: Scan csls container with Picket
        uses: willibrandon/picket@v0
        with:
          docker-archive: artifacts/release-container-validation/csls-${{ matrix.architecture }}.tar
          cache-mode: secret-hash-only
          fail-on: findings
          ignore-path: .picketignore
          max-archive-depth: 2
          max-archive-entries: 100000
          max-archive-megabytes: 4096
          max-archive-ratio: 1000
          max-target-megabytes: 64
          redact: 100
          report-directory: artifacts/picket-csls-${{ matrix.architecture }}
          timeout: 900
          upload-sarif: false

      - name: Scan csls-mcp container with Picket
        uses: willibrandon/picket@v0
        with:
          docker-archive: artifacts/release-container-validation/csls-mcp-${{ matrix.architecture }}.tar
          cache-mode: secret-hash-only
          fail-on: findings
          ignore-path: .picketignore
          max-archive-depth: 2
          max-archive-entries: 100000
          max-archive-megabytes: 4096
          max-archive-ratio: 1000
          max-target-megabytes: 64
          redact: 100
          report-directory: artifacts/picket-csls-mcp-${{ matrix.architecture }}
          timeout: 900
          upload-sarif: false

      - name: Upload container scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: picket-release-containers-${{ matrix.architecture }}
          path: artifacts/picket-*-${{ matrix.architecture }}
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.assemble.result == 'success' &&
      needs.containers.result == 'success'
    needs:
      - prepare
      - assemble
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Set up Node.js
        if: needs.prepare.outputs.prerelease == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Download complete release
        uses: actions/download-artifact@v8
        with:
          name: release-final
          path: artifacts/release-final

      - name: Install editor publishers
        if: needs.prepare.outputs.prerelease == 'false'
        run: npm ci --ignore-scripts --prefix editors/vscode

      - name: Verify editor publication access
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          dotnet run --file scripts/Publish-VsCodeExtension.cs --
          --version "${{ needs.prepare.outputs.version }}"
          --packages artifacts/release-final/public
          --verify-only true

      - name: Authenticate to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >-
          dotnet run --file scripts/Publish-NuGet.cs --
          --packages artifacts/release-final/public

      - name: Publish Visual Studio Code extension
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          dotnet run --file scripts/Publish-VsCodeExtension.cs --
          --version "${{ needs.prepare.outputs.version }}"
          --packages artifacts/release-final/public

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet run --file scripts/Publish-GitHubRelease.cs --
          --tag "${{ needs.prepare.outputs.tag }}"
          --version "${{ needs.prepare.outputs.version }}"
          --assets artifacts/release-final/public
          --prerelease "${{ needs.prepare.outputs.prerelease }}"

  advance-container-tags:
    name: Advance stable container tags
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.outputs.prerelease == 'false' &&
      needs.publish.result == 'success'
    needs:
      - prepare
      - containers
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance latest container tags
        run: >-
          dotnet run --file scripts/Publish-ContainerTags.cs --
          --csls-digest "${{ needs.containers.outputs.csls-digest }}"
          --csls-mcp-digest "${{ needs.containers.outputs.csls-mcp-digest }}"
