name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  references:
    name: Verify generated references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Verify generated references
        run: dotnet run --file scripts/Generate-Docs.cs -- --verify

      - name: Retain reference build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-reference-build
          path: artifacts/diagnostics/documentation-inputs
          if-no-files-found: ignore

  site:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build and upload docs
        uses: withastro/action@v6
        env:
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        with:
          path: docs-site
          node-version: 24.x
          package-manager: npm

      - name: Verify links and accessibility
        run: dotnet run --file scripts/Verify-Docs.cs
        env:
          VERSION: ''

  build:
    name: Build docs
    if: always()
    needs: [references, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Require generated references
        run: dotnet run --file scripts/Verify-WorkflowDependency.cs
        env:
          CSLS_WORKFLOW_DEPENDENCY_RESULT: ${{ needs.references.result }}

      - name: Require site and accessibility checks
        run: dotnet run --file scripts/Verify-WorkflowDependency.cs
        env:
          CSLS_WORKFLOW_DEPENDENCY_RESULT: ${{ needs.site.result }}

  deploy:
    name: Deploy docs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
