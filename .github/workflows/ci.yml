name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Verify repository policy
        run: dotnet run --file scripts/Verify-Repository.cs

      - name: Provision actionlint
        run: dotnet run --file scripts/Provision-Actionlint.cs

      - name: Verify GitHub Actions workflows
        run: dotnet run --file scripts/Verify-GitHubActions.cs

  repository-formatting:
    name: Repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: artifacts/nuget-packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'NuGet.Config', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/*.vbproj', '**/*.fsproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        run: dotnet restore Csls.slnx

      - name: Build F# expression provider
        run: >-
          dotnet build
          src/Csls.Debugger.Evaluator.FSharp/Csls.Debugger.Evaluator.FSharp.fsproj
          --no-restore

      - name: Verify whitespace formatting
        run: dotnet format Csls.slnx whitespace --verify-no-changes --no-restore

      - name: Verify code-style formatting
        run: dotnet format Csls.slnx style --verify-no-changes --no-restore

  native-aot-size:
    name: Native AOT size (${{ matrix.command }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: csls
            project: src/Csls.App/Csls.App.csproj
            target: artifacts/obj/Csls.App/release_linux-x64/native/csls.mstat
            budget: max=8mb
          - command: csls-mcp
            project: src/Csls.Mcp/Csls.Mcp.csproj
            target: artifacts/obj/Csls.Mcp/release_linux-x64/native/csls-mcp.mstat
            budget: max=8mb
          - command: csls-debugger-worker
            project: src/Csls.Debugger.Worker/Csls.Debugger.Worker.csproj
            target: artifacts/obj/Csls.Debugger.Worker/release_linux-x64/native/csls-debugger-worker.mstat
            budget: max=40mb

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish Native AOT launcher
        run: >-
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output artifacts/size-check/${{ matrix.command }}
          -p:CslsPublishBundledWorkers=false
          -p:IlcGenerateMstatFile=true

      - name: Check Native AOT size
        uses: willibrandon/dotsider@v0
        with:
          target: ${{ matrix.target }}
          baseline-key: ${{ matrix.command }}-linux-x64
          budgets: ${{ matrix.budget }}
          top: '20'
          report-directory: ${{ runner.temp }}/dotsider-size-${{ matrix.command }}-linux-x64
          artifact-name: dotsider-size-${{ matrix.command }}-linux-x64

      - name: Exercise Native AOT debugger worker
        if: matrix.command == 'csls-debugger-worker'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/size-check/csls-debugger-worker
        run: artifacts/size-check/csls-debugger-worker/csls-debugger-worker doctor

  build:
    name: Build solution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: artifacts/nuget-packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'NuGet.Config', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj', '**/*.vbproj', '**/*.fsproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution
        run: dotnet build Csls.slnx --property:RuntimeIdentifiers=

  language-server-e2e:
    name: Language server E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Run language server E2E
        run: >-
          dotnet test --project tests/Csls.Tests/Csls.Tests.csproj
          --property:RuntimeIdentifiers=
          --filter "FullyQualifiedName=Csls.Tests.StdioLanguageServerTests.WorkerServesHoverAndShutsDownCleanly|FullyQualifiedName=Csls.Tests.McpLanguageServerTests.McpExposesAttachedLanguageServerSession|FullyQualifiedName=Csls.Tests.CliTransientWorkspaceTests.QueryAndEditWithWorkspaceUseTransientLanguageServer|FullyQualifiedName=Csls.Tests.DebuggerTerminalTests.TerminalNavigatesStoppedStateAndKeepsExecutionControlsResponsive|FullyQualifiedName=Csls.Tests.DoctorCliTests.DoctorIgnoresInheritedMSBuildToolsetForWorkspaceProcesses"
          --minimum-expected-tests 5

  debugger-e2e:
    name: Debugger E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Run debugger E2E
        run: >-
          dotnet test --project tests/Csls.Debugger.Tests/Csls.Debugger.Tests.csproj
          --property:RuntimeIdentifiers=
          --filter "FullyQualifiedName=Csls.Debugger.Tests.DapMessageReaderTests.FragmentedOperatingSystemPipeRequestIsReassembled|FullyQualifiedName=Csls.Debugger.Tests.DapMessageReaderTests.CoalescedOperatingSystemPipeRequestsRemainIndependent|FullyQualifiedName=Csls.Debugger.Tests.DapMessageReaderTests.UnmatchedReverseResponseDoesNotDisruptNextRequest|FullyQualifiedName=Csls.Debugger.Tests.DapMessageReaderTests.ReverseResponseRequiresBooleanSuccess|FullyQualifiedName=Csls.Debugger.Tests.DebugAdapterProcessTests.DebuggerCommandKeepsStandardOutputProtocolOnly|FullyQualifiedName=Csls.Debugger.Tests.DapDumpTests.ReadOnlyDumpPreservesInspectionAndClosesSession|FullyQualifiedName=Csls.Debugger.Tests.DapAsyncEntryPointTests.StopAtEntryUsesAsyncTopLevelSource|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.RepeatedArrayPagesReuseRetainedElements|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.ArrayReferenceOverloadsUseExactLoadedTypes|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.NumericWideningSelectsAndMarshalsParameterType|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.AbruptTargetDeathDuringEvaluationCompletesPendingRequest|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.EnvironmentExitDuringEvaluationCompletesAndCleansUpTarget|FullyQualifiedName=Csls.Debugger.Tests.DapStepExitTests.EnvironmentExitDuringStepCompletesAndTerminates|FullyQualifiedName=Csls.Debugger.Tests.DebuggerValueRetentionTests.RepeatedArrayPagesKeepRetentionBounded|FullyQualifiedName~Csls.Debugger.Tests.DapTerminationTests|FullyQualifiedName~Csls.Debugger.Tests.DebuggerTerminalLauncherTests|FullyQualifiedName~Csls.Debugger.Tests.DapTerminalConsoleTests|FullyQualifiedName~Csls.Debugger.Tests.DapTerminalCancellationTests|FullyQualifiedName~Csls.Debugger.Tests.DapRepeatedAttachTests|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.NonInteractiveEvaluateContextsDoNotExecuteTargetCode|FullyQualifiedName=Csls.Debugger.Tests.DapArrayPagingTests.NamedArgumentsFollowLoadedParameterNamesAndClrOrder|FullyQualifiedName=Csls.Debugger.Tests.DapVisualBasicNamedArgumentTests.NamedArgumentsBindCaseInsensitivelyAgainstVisualBasicMetadata|FullyQualifiedName=Csls.Debugger.Tests.DapFSharpExpressionTests.NullTestsUseFSharpReferenceSemantics|FullyQualifiedName=Csls.Debugger.Tests.DapOptionalArgumentTests.OptionalArgumentsUseLoadedMetadataDefaults|FullyQualifiedName=Csls.Debugger.Tests.CodeQlReadonlyAnalyzerProcessTests.StructReadonlyFindingsAreCaughtBeforeCodeQl|FullyQualifiedName=Csls.Debugger.Tests.DapOptionalArgumentTests.ContextualDefaultsFollowCompilerInvocationSemantics|FullyQualifiedName=Csls.Debugger.Tests.DapOptionalArgumentTests.TypedDefaultsRetainTheirDeclaredTypes|FullyQualifiedName=Csls.Debugger.Tests.DapOptionalArgumentTests.TypedDefaultsAssignOnlyToMatchingStructStorage"
          --minimum-expected-tests 48

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository with Picket
        uses: willibrandon/picket@v0
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          ignore-path: .picketignore
          max-archive-depth: 2
          max-archive-entries: 100000
          max-archive-megabytes: 4096
          max-archive-ratio: 1000
          max-target-megabytes: 64
          redact: 100
          timeout: 240
          upload-sarif: true
