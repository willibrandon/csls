name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository policy
        run: dotnet run --file scripts/Verify-Repository.cs

      - name: Provision actionlint
        run: dotnet run --file scripts/Provision-Actionlint.cs

      - name: Verify GitHub Actions workflows
        run: dotnet run --file scripts/Verify-GitHubActions.cs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository with Picket
        uses: willibrandon/picket@4c9f7d28260bfe0a7334865c84db093519f6f57f # v0.2.12
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          ignore-path: .picketignore
          max-archive-depth: 2
          max-archive-entries: 100000
          max-archive-megabytes: 4096
          max-archive-ratio: 1000
          max-target-megabytes: 64
          redact: 100
          timeout: 600
          upload-sarif: true

  build-test-package:
    name: Build, test, and package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            size_budget: max=8mb
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            size_budget: max=8mb
          - os: windows-latest
            rid: win-x64
            size_budget: max=8mb
          - os: windows-11-arm
            rid: win-arm64
            size_budget: max=8mb
          - os: macos-26-intel
            rid: osx-x64
            size_budget: max=8mb
          - os: macos-26
            rid: osx-arm64
            size_budget: max=8mb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore Csls.slnx

      - name: Install Native AOT prerequisites
        run: dotnet run --file scripts/Install-NativeAotPrerequisites.cs -- --runtime ${{ matrix.rid }}

      - name: Verify formatting
        run: dotnet format Csls.slnx --verify-no-changes --no-restore

      - name: Provision parity oracle
        run: dotnet run --file scripts/Provision-CsharpLsOracle.cs

      - name: Provision Fresh
        run: dotnet run --file scripts/Provision-Fresh.cs

      - name: Provision GNU Emacs
        run: dotnet run --file scripts/Provision-Emacs.cs

      - name: Provision Helix
        run: dotnet run --file scripts/Provision-Helix.cs

      - name: Provision Neovim
        run: dotnet run --file scripts/Provision-Neovim.cs

      - name: Test
        run: dotnet test --solution Csls.slnx --report-trx --results-directory TestResults/${{ matrix.rid }}

      - name: Verify .NET tool packages
        run: dotnet run --file scripts/Verify-ToolPackages.cs

      - name: Check csls Native AOT size
        uses: willibrandon/dotsider@3f243c9ab2e9d6d3432c608bebba0beaa8b239ec # Retry Dotsider baseline requests
        with:
          target: artifacts/obj/Csls.App/release_${{ matrix.rid }}/native/csls.mstat
          baseline-key: csls-${{ matrix.rid }}
          budgets: ${{ matrix.size_budget }}
          top: '20'
          dotsider-version: v0.26.0
          report-directory: ${{ runner.temp }}/dotsider-size-csls-${{ matrix.rid }}
          artifact-name: dotsider-size-csls-${{ matrix.rid }}

      - name: Check csls-mcp Native AOT size
        uses: willibrandon/dotsider@3f243c9ab2e9d6d3432c608bebba0beaa8b239ec # Retry Dotsider baseline requests
        with:
          target: artifacts/obj/Csls.Mcp/release_${{ matrix.rid }}/native/csls-mcp.mstat
          baseline-key: csls-mcp-${{ matrix.rid }}
          budgets: ${{ matrix.size_budget }}
          top: '20'
          dotsider-version: v0.26.0
          report-directory: ${{ runner.temp }}/dotsider-size-csls-mcp-${{ matrix.rid }}
          artifact-name: dotsider-size-csls-mcp-${{ matrix.rid }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults/${{ matrix.rid }}
          if-no-files-found: warn

  legacy-build-host:
    name: Legacy build host (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: mono-linux
          - os: macos-26-intel
            host: mono-macos
          - os: windows-latest
            host: visual-studio
    env:
      CSLS_REQUIRE_LEGACY_BUILD_HOST: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Provision legacy build host
        run: dotnet run --file scripts/Provision-LegacyBuildHost.cs

      - name: Test legacy build host
        run: >-
          dotnet test --project tests/Csls.Tests/Csls.Tests.csproj
          --filter "TestCategory=LegacyBuildHost"
          --report-trx
          --results-directory TestResults/${{ matrix.host }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.host }}
          path: TestResults/${{ matrix.host }}
          if-no-files-found: warn

  additional-rid-packages:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x86
            validation: execute
          - os: ubuntu-latest
            rid: linux-musl-x64
            validation: package
            size_budget: max=8mb
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            validation: package
            size_budget: max=8mb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Install Native AOT prerequisites
        run: dotnet run --file scripts/Install-NativeAotPrerequisites.cs -- --runtime ${{ matrix.rid }}

      - name: Provision target .NET SDK
        if: matrix.rid == 'win-x86'
        run: dotnet run --file scripts/InstallDotNet.cs -- --runtime ${{ matrix.rid }}

      - name: Verify additional RID packages
        run: >-
          dotnet run --file scripts/Verify-ToolPackages.cs --
          --runtime ${{ matrix.rid }}
          --validation ${{ matrix.validation }}
          --target-dotnet-root artifacts/tools/dotnet/${{ matrix.rid }}

      - name: Check csls Native AOT size
        if: matrix.validation == 'package'
        uses: willibrandon/dotsider@3f243c9ab2e9d6d3432c608bebba0beaa8b239ec # Retry Dotsider baseline requests
        with:
          target: artifacts/obj/Csls.App/release_${{ matrix.rid }}/native/csls.mstat
          baseline-key: csls-${{ matrix.rid }}
          budgets: ${{ matrix.size_budget }}
          top: '20'
          dotsider-version: v0.26.0
          report-directory: ${{ runner.temp }}/dotsider-size-csls-${{ matrix.rid }}
          artifact-name: dotsider-size-csls-${{ matrix.rid }}

      - name: Check csls-mcp Native AOT size
        if: matrix.validation == 'package'
        uses: willibrandon/dotsider@3f243c9ab2e9d6d3432c608bebba0beaa8b239ec # Retry Dotsider baseline requests
        with:
          target: artifacts/obj/Csls.Mcp/release_${{ matrix.rid }}/native/csls-mcp.mstat
          baseline-key: csls-mcp-${{ matrix.rid }}
          budgets: ${{ matrix.size_budget }}
          top: '20'
          dotsider-version: v0.26.0
          report-directory: ${{ runner.temp }}/dotsider-size-csls-mcp-${{ matrix.rid }}
          artifact-name: dotsider-size-csls-mcp-${{ matrix.rid }}
