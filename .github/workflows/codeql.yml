name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 8 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          build-mode: none
          config-file: ./.github/codeql-config.yml
          languages: csharp
          queries: security-and-quality

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: artifacts/codeql-results

      - name: Enforce zero CodeQL findings
        run: dotnet run --file scripts/Verify-CodeQl.cs -- artifacts/codeql-results
